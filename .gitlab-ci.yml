stages:
  - build
  - release

variables:
  MAJOR_MINOR: "1.0"
  APP_VERSION: "${MAJOR_MINOR}.${CI_PIPELINE_IID}"
  PACKAGE_NAME: "TelegramWebDAV-v${APP_VERSION}-win-x64.zip"

build_windows:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apt-get update && apt-get install -y zip curl
  script:
    - echo "Сборка TelegramWebDAV версии ${APP_VERSION}..."
    - dotnet publish TelegramWebDAV/TelegramWebDAV.csproj -c Release -r win-x64 --self-contained false -p:EnableWindowsTargeting=true -p:Version="${APP_VERSION}" -p:AssemblyVersion="${APP_VERSION}" -p:FileVersion="${APP_VERSION}" -o ./publish/
    - cd publish && zip -r "../${PACKAGE_NAME}" ./* && cd ..
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "${PACKAGE_NAME}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/TelegramWebDAV/${APP_VERSION}/${PACKAGE_NAME}"
  artifacts:
    paths:
      - "${PACKAGE_NAME}"
    expire_in: 1 week

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "Создание GitLab Release для версии ${APP_VERSION}..."
  release:
    name: "Релиз TelegramWebDAV v${APP_VERSION}"
    tag_name: "v${APP_VERSION}"
    description: "Автоматический релиз для коммита $CI_COMMIT_SHORT_SHA ($CI_COMMIT_TITLE)."
    assets:
      links:
        - name: "Скачать ${PACKAGE_NAME} (Windows x64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/TelegramWebDAV/${APP_VERSION}/${PACKAGE_NAME}"
